[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
tauri-plugin-autostart = "2.7"
# 3.0 is alpha.
tauri-plugin-notification = "2.7"
tauri-plugin-opener = "2.7"
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
# No "zip": it only reads Tauri v1 Windows bundles. native-tls matches the other HTTP clients.
tauri-plugin-updater = { version = "2.14", default-features = false, features = [
  "native-tls",
  "system-proxy",
] }
anyhow = "1.0"
base64 = "0.22"
# gRPC over HTTP/2 for the optional Wispr Flow engine, built only with `--features wispr`.
bytes = "1.12"
h2 = "0.4"
http = "1.5"
native-tls = { version = "0.2", features = ["alpn"] }
tokio-native-tls = "0.3"
uuid = { version = "1.28", features = ["v4"] }
cidre = { version = "0.29", default-features = false, features = [
  "core_audio",
  "dispatch",
  "blocks",
  "macos_14_4",
  "io_kit",
  "io_pm",
  "sc",
  "vt",
  "av",
  "cg",
  "ut",
] }
cpal = "0.18"
hound = "3.5"
# Lossless stems for the Drive archive, pure Rust. No threads: the archive encodes one stem at a
# time in the background.
flacenc = { version = "0.5", default-features = false }
claxon = "0.4"
ogg = "0.9"
# Pure Rust Opus: no C toolchain, CMake or system libopus on Mac or Windows.
opus-rs = "0.1.42"
# Sinc resampling only: the FFT resampler and its realfft dependency are not used.
rubato = { version = "5.0", default-features = false }
rtrb = "0.4"
jiff = { version = "0.2", features = ["serde"] }
md-5 = "0.11"
oauth2 = { version = "5.0", default-features = false, features = [
  "native-tls",
  "reqwest-blocking",
] }
rig-agent = { version = "0.44", default-features = false }
rig-core = { version = "0.44", default-features = false, features = ["reqwest", "native-tls"] }
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "native-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
thiserror = "2.0"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
whatlang = "0.18"
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
minijinja = { version = "3.0", features = ["serde"] }
rusqlite = { version = "0.42", features = ["bundled"] }
schemars = "1.2"
slug = "0.1"
# Process CPU and memory, and disk free, on Mac and Windows with no unsafe code here.
sysinfo = { version = "0.40", default-features = false, features = ["disk", "system"] }
serde-saphyr = "2.0"
sha2 = "0.11"
tempfile = "3.27"
toml = "1.1"
browser-shortcut = { path = "crates/browser-shortcut" }
call-finalize = { path = "crates/call-finalize" }
call-folder = { path = "crates/call-folder" }
capture = { path = "crates/capture" }
capture-protocol = { path = "crates/capture-protocol" }
detectors = { path = "crates/detectors" }
huddle-captions = { path = "crates/huddle-captions" }
jobs = { path = "crates/jobs" }
native-host = { path = "crates/native-host" }
pipeline = { path = "crates/pipeline" }
sources = { path = "crates/sources" }
stem-timing = { path = "crates/stem-timing" }
stem-writer = { path = "crates/stem-writer" }
stt = { path = "crates/stt" }
telemetry = { path = "crates/telemetry" }
video-capture = { path = "crates/video-capture" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
