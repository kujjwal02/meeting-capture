[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"

[workspace.dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
anyhow = "1.0"
axum = "0.8"
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
thiserror = "2.0"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
minijinja = { version = "3.0", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
slug = "0.1"
serde-saphyr = "2.0"
sha2 = "0.11"
tempfile = "3.27"
toml = "1.1"
jobs = { path = "crates/jobs" }
pipeline = { path = "crates/pipeline" }
sources = { path = "crates/sources" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
