name: Rerun jobs that got no runner

# GitHub cancels a job after about 15 minutes when no hosted runner takes it. Runs from the default
# branch's copy of this file and checks out nothing, so a fork's pull request cannot change it.
on:
  workflow_run:
    workflows: [Check, Release]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      github.event.workflow_run.run_attempt < 3 &&
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      checks: read
    steps:
      - name: Rerun the failed jobs when GitHub found them no runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          no_runner_message="The job was not acquired by Runner of type hosted even after multiple attempts"
          # A manual cancel has no such annotation, so it stays cancelled.
          is_no_runner=false
          # Each gh call sits in an assignment, so a failed call stops the step.
          cancelled_job_ids=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs" \
            -q '.jobs[] | select(.conclusion == "cancelled" and (.steps | length) == 0) | .id')
          for job_id in $cancelled_job_ids; do
            annotation_messages=$(gh api "repos/$REPOSITORY/check-runs/$job_id/annotations" -q '.[].message')
            if printf '%s\n' "$annotation_messages" | grep -qF "$no_runner_message"; then
              is_no_runner=true
            fi
          done
          if [ "$is_no_runner" = false ]; then
            echo "No job lacked a runner."
            exit 0
          fi
          # Check cancels older runs of a ref, so rerunning an old run would cancel a newer one.
          newest_run_id=$(gh api -X GET "repos/$REPOSITORY/actions/workflows/$WORKFLOW_ID/runs" \
            -f branch="$HEAD_BRANCH" -F per_page=1 -q '.workflow_runs[0].id')
          if [ "$newest_run_id" != "$RUN_ID" ]; then
            echo "Run $newest_run_id is newer. Leaving run $RUN_ID."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
