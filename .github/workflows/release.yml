name: Release

# Push a tag such as v0.2.0 on a commit whose workspace version is 0.2.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg-sha256: ${{ steps.publish.outputs.dmg-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: just@1.58.0,tauri-cli@2.12.3
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check the tag matches the workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "meeting-capture") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The same self-signed identity as `just signing-cert`, so macOS keeps the app's permissions
      # across updates.
      - name: Import the signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/identity.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-certificate -c "Meeting Capture" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          security find-identity -v -p codesigning "$keychain" | grep '"Meeting Capture"'

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: just bundle

      - name: Publish the GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/dist/* --verify-tag \
            --title "Meeting Capture $VERSION" --generate-notes
          dmg_sha256=$(cut -d ' ' -f 1 "target/dist/Meeting-Capture_${VERSION}_aarch64.dmg.sha256")
          echo "dmg-sha256=$dmg_sha256" >> "$GITHUB_OUTPUT"

  homebrew-tap:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kujjwal02/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Point the cask at the new release
        env:
          VERSION: ${{ needs.release.outputs.version }}
          DMG_SHA256: ${{ needs.release.outputs.dmg-sha256 }}
        run: |
          sed -i -E \
            -e "s/^  version \".*\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \".*\"$/  sha256 \"$DMG_SHA256\"/" \
            Casks/meeting-capture.rb
          git diff --exit-code --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "meeting-capture $VERSION"
          git push
