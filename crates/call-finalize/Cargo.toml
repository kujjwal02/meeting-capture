[package]
name = "call-finalize"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
capture-protocol.workspace = true
call-folder.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
stem-timing.workspace = true
stem-writer.workspace = true
thiserror.workspace = true
tracing.workspace = true
video-capture.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cidre.workspace = true

# The workspace forbids unsafe code, and `forbid` cannot be lowered per module. CoreMedia builds
# sample buffers through raw pointers, so this crate denies unsafe code and allows it in
# `mac::mp4` alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
