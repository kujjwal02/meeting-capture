# Slack desktop 4.52 on macOS, read on 2026-10-17. Each value is a marker the huddle watcher looks
# for in Slack's accessibility tree. A file with the same id in the app's slack-layouts folder
# overrides this one.
id = "2026-10-slack-4.52"
tested_on = ["4.52.171"]

[huddle_window]
# Every Slack child window has this toolbar; the main window does not.
child_window_toolbar = "Child window toolbar"
content_class = "p-huddle_window__content_container"
# A button in the main window during a huddle. With it and an unreadable child window, the
# huddle window's layout changed.
in_huddle_button = "Leave huddle"

[transcript_list]
role = "AXList"
description = "Transcript"
speaker_class = "p-huddle_event_log__member_name"
text_class = "p-huddle_event_log__event_text"
header_class = "p-huddle_event_log__header_text"
language_prefix = "Captions are being generated in "

[overlay]
class = "p-huddle_closed_captions"
line_class = "p-huddle_closed_caption_event__wrapper"

[tiles]
role = "AXCell"
id_prefix = "huddle-grid-gridcell-"
self_marker = "self_"
name_prefix = "View "
name_suffix = "'s profile"

[captions_tab]
id = "captions"
title = "Captions"
active_class = "c-tabs__tab--active"
