[package]
name = "huddle-captions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sources.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "libc",
  "NSRunningApplication",
] }
objc2-application-services = { version = "0.3", default-features = false, features = [
  "std",
  "HIServices",
  "AXError",
  "AXUIElement",
  "libc",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSEnumerator",
  "NSString",
  "NSURL",
] }

[dev-dependencies]
tracing-subscriber.workspace = true

# The workspace forbids unsafe code, and `forbid` cannot be lowered per module. This crate calls
# the macOS accessibility API, so it denies unsafe code and allows it in `mac::ax` alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
