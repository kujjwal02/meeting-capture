[package]
name = "stt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# The Wispr Flow dictation engine. Off by default: it drives Wispr's own gRPC API with a token
# borrowed from the desktop app, which is unsupported and against Wispr's terms of service. Build
# with `--features wispr` to include it.
wispr = [
  "dep:base64",
  "dep:bytes",
  "dep:h2",
  "dep:http",
  "dep:native-tls",
  "dep:tokio",
  "dep:tokio-native-tls",
  "dep:uuid",
]

[dependencies]
hound.workspace = true
ogg.workspace = true
opus-rs.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
native-tls = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "net", "io-util", "time"] }
tokio-native-tls = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[lints]
workspace = true
