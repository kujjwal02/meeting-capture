[package]
name = "meeting-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[build-dependencies]
tauri-build.workspace = true

[features]
# Build the optional Wispr Flow transcription engine into the app.
wispr = ["pipeline/wispr", "stt/wispr"]


[dependencies]
base64.workspace = true
browser-shortcut.workspace = true
call-folder.workspace = true
capture-protocol.workspace = true
detectors.workspace = true
huddle-captions.workspace = true
jiff.workspace = true
jobs.workspace = true
native-host.workspace = true
pipeline.workspace = true
serde.workspace = true
serde_json.workspace = true
sources.workspace = true
stem-writer.workspace = true
stt.workspace = true
sysinfo.workspace = true
video-capture.workspace = true
tauri.workspace = true
telemetry.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "sync", "time"] }
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFArray",
  "CFDictionary",
  "CFNumber",
  "CFString",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSProcessInfo",
] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "ps"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_System_Power"] }

# The workspace forbids unsafe code, and `forbid` cannot be lowered per module. The power probe
# calls IOKit and Win32, so the crate denies unsafe code and allows it in that probe alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
