[package]
name = "video-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
call-folder.workspace = true
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true
sources.workspace = true
stem-timing.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
cidre.workspace = true

# The workspace forbids unsafe code, and `forbid` cannot be lowered per module. ScreenCaptureKit,
# VideoToolbox and AVAssetWriter call back into Objective-C classes this crate defines, so it
# denies unsafe code and allows it in `mac::stream`, `mac::encoder` and `mac::muxer` alone.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
